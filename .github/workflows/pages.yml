name: Deploy Kaitai WebIDE

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          check-latest: true
          cache: npm

      - name: Update Kaitai packages
        run: |
          npm install --package-lock-only \
            kaitai-struct-compiler@next \
            kaitai-struct@next

      - name: Install dependencies
        run: npm ci

      - name: Show versions
        run: |
          echo "=== OS ==="
          cat /etc/os-release
          echo "ImageOS=$ImageOS"
          echo "ImageVersion=$ImageVersion"

          echo "=== Node / npm ==="
          node --version
          npm --version

          echo "=== Kaitai ==="
          npm list kaitai-struct-compiler kaitai-struct

      - name: Build
        run: ./build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
